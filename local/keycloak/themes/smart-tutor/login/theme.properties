# Smart Tutor login theme (#48): Keycloak's stock keycloak.v2 layout, fields, and messages, restyled with
# the Smart Tutor logo, colors, and font only. No .ftl template is overridden. PRD US-1, Q46; brief §6.2.
parent=keycloak.v2
import=common/keycloak

# css/styles.css is keycloak.v2's own sheet; css/tokens.css is generated from web/src/styles/tokens.css.
styles=css/styles.css css/tokens.css css/smart-tutor.css
