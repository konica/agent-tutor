# On-premise mode (#148, ADR 0012): Smart Tutor on one VM. deploy.sh runs it with the env file it renders from SSM and
# Secrets Manager (/etc/smart-tutor/smart-tutor.env, root only); runbook: docs/runbooks/on-premise-deploy.md.
#   docker compose -f /opt/smart-tutor/on-premise/compose.yaml --env-file /etc/smart-tutor/smart-tutor.env ps
# Our images come from on-premise's ECR repositories (`smart-tutor-on-premise/<service>`) by commit tag. Caddy is the
# only service with public ports. Data lives on the data volume (/data). The worker, agent, and MCP server (#149) run
# as the image's non-root user on a read-only root filesystem, like the Helm charts. The worker reaches only Postgres
# and, through the egress proxy, its AWS endpoints and LangSmith (#153, #229); deploy.sh checks the running worker's isolation and egress
# after every deploy.

name: smart-tutor

x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "5"}

networks:
  # The worker parses untrusted PDFs (PRD §9.10). On this network it reaches Postgres and the egress proxy only:
  # an internal network has no route out of the VM and no external DNS.
  worker:
    internal: true

services:
  postgres:
    image: &postgres-image pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      # Read only by deploy.sh's role bootstrap (psql \getenv), so the passwords never appear on a command line.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    networks: [default, worker]
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 12

  keycloak:
    image: ${REGISTRY:?}/${REPOSITORY_PREFIX:?}/keycloak:${IMAGE_TAG:?}
    restart: unless-stopped
    logging: *logging
    command: [start, --optimized, --import-realm]
    environment:
      # The public address with /auth (ADR 0012); without it Keycloak refuses to start.
      KC_HOSTNAME: https://${DOMAIN:?}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"  # the API introspects at keycloak:8080 (ADR 0007)
      KC_HTTP_ENABLED: "true"  # TLS ends at Caddy
      KC_PROXY_HEADERS: xforwarded  # Caddy sets X-Forwarded-Proto and -Host itself, so cookies are Secure
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      # Read by the realm import (the Helm chart's realm file).
      SMART_TUTOR_PUBLIC_URL: https://${DOMAIN:?}
      SMART_TUTOR_API_CLIENT_SECRET: ${API_CLIENT_SECRET:?}
      SMART_TUTOR_MCP_CLIENT_SECRET: ${MCP_CLIENT_SECRET:?}
    volumes:
      - ../helm/smart-tutor/charts/keycloak/files/realm-smart-tutor.json:/opt/keycloak/data/import/realm-smart-tutor.json:ro
    mem_limit: 1536m  # the JVM sizes its heap from the limit, not from the VM
    healthcheck:
      # The image has no curl: speak HTTP over bash's /dev/tcp to the management port.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 180s  # the first start creates the schema and imports the realm
    depends_on:
      postgres: {condition: service_healthy}

  # Alembic to head; deploy.sh runs it before starting a new tag (`docker compose run --rm migrate`).
  migrate:
    image: ${REGISTRY:?}/${REPOSITORY_PREFIX:?}/api:${IMAGE_TAG:?}
    profiles: [tools]
    logging: *logging
    command: ["python", "-m", "smart_tutor.apps.jobs.migrate"]
    environment:
      SMART_TUTOR_DATABASE_URL: ${APP_DATABASE_URL:?}  # built by deploy.sh (see there)
    depends_on:
      postgres: {condition: service_healthy}

  # Scheduled jobs (profile `jobs`) are one-off containers a systemd timer starts with `docker compose run --rm`
  # (docs/runbooks/on-premise-backups.md, "Scheduled jobs"). This one dumps one database to /data/backups for
  # backup.sh: `run --rm -T pg-dump --file=/backups/<file> <database>`. The server's image, so pg_dump matches it.
  pg-dump:
    image: *postgres-image
    profiles: [jobs]
    logging: *logging
    entrypoint: [pg_dump, --host=postgres, --username=postgres, --format=custom]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - /data/backups:/backups
    depends_on:
      postgres: {condition: service_healthy}

  api:
    image: ${REGISTRY:?}/${REPOSITORY_PREFIX:?}/api:${IMAGE_TAG:?}
    restart: unless-stopped
    logging: *logging
    environment:
      SMART_TUTOR_ENVIRONMENT: prod
      SMART_TUTOR_ROOT_PATH: /api
      SMART_TUTOR_AWS_REGION: ${AWS_REGION:?}
      AWS_REGION: ${AWS_REGION:?}
      SMART_TUTOR_KEYCLOAK_ISSUER: https://${DOMAIN:?}/auth/realms/smart-tutor
      SMART_TUTOR_KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth/realms/smart-tutor
      SMART_TUTOR_KEYCLOAK_CLIENT_ID: smart-tutor-api
      SMART_TUTOR_KEYCLOAK_CLIENT_SECRET: ${API_CLIENT_SECRET:?}
      SMART_TUTOR_AGENT_URL: http://agent:8080
      SMART_TUTOR_DATABASE_URL: ${APP_DATABASE_URL:?}  # built by deploy.sh (see there)
      SMART_TUTOR_CORS_ORIGINS: "[]"  # the web app calls /api on its own origin
      SMART_TUTOR_DOCUMENTS_BUCKET: ${DOCUMENTS_BUCKET:?}
      SMART_TUTOR_INGEST_QUEUE_URL: ${INGEST_QUEUE_URL:?}
      # On-premise has its own SSM path (ConfigStack); the defaults name native-cloud's.
      SMART_TUTOR_MAX_UPLOAD_MB_PARAM: ${SSM_PATH:?}/max-upload-mb
      SMART_TUTOR_MAX_PAGES_PARAM: ${SSM_PATH:?}/max-pages
      SMART_TUTOR_MAX_PROCESSING_ATTEMPTS_PARAM: ${SSM_PATH:?}/max-processing-attempts
      SMART_TUTOR_MAX_UPLOADS_PER_HOUR_PARAM: ${SSM_PATH:?}/max-uploads-per-hour
      SMART_TUTOR_MAX_UPLOADS_PER_DAY_PARAM: ${SSM_PATH:?}/max-uploads-per-day
      SMART_TUTOR_APP_TIME_ZONE_PARAM: ${SSM_PATH:?}/app-time-zone
      SMART_TUTOR_LEARNING_RECORD_IDLE_MINUTES_PARAM: ${SSM_PATH:?}/learning-record-idle-minutes
      HOME: /tmp  # botocore looks for ~/.aws; the image user has no home. Credentials come from the instance profile.
    mem_limit: 512m
    healthcheck:
      # /healthz needs neither a token nor Keycloak.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_started}
      agent: {condition: service_started}

  # The tutoring agent (LangGraph); the API proxies chat to it and it calls the MCP server for retrieval.
  agent:
    image: ${REGISTRY:?}/${REPOSITORY_PREFIX:?}/agent:${IMAGE_TAG:?}
    restart: unless-stopped
    logging: *logging
    environment:
      SMART_TUTOR_ENVIRONMENT: prod
      SMART_TUTOR_DEPLOYMENT: on-premise
      # Traces (PRD §10.4, #229): tracing is off until the LangSmith API key's secret exists (deploy.sh).
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:?}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_PROJECT: smart-tutor-on-premise
      LANGSMITH_TRACING_SAMPLING_RATE: ${TRACE_SAMPLING_RATE:?}
      SMART_TUTOR_LEARNER_HASH_KEY: ${LEARNER_HASH_KEY:?}
      SMART_TUTOR_AWS_REGION: ${AWS_REGION:?}
      AWS_REGION: ${AWS_REGION:?}
      SMART_TUTOR_KEYCLOAK_ISSUER: https://${DOMAIN:?}/auth/realms/smart-tutor
      SMART_TUTOR_KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth/realms/smart-tutor
      SMART_TUTOR_KEYCLOAK_CLIENT_ID: smart-tutor-api
      SMART_TUTOR_KEYCLOAK_CLIENT_SECRET: ${API_CLIENT_SECRET:?}
      SMART_TUTOR_DATABASE_URL: ${APP_DATABASE_URL:?}  # built by deploy.sh (see there)
      SMART_TUTOR_MCP_URL: http://mcp:8000/mcp
      HOME: /tmp  # botocore looks for ~/.aws; the root filesystem is read-only
    read_only: true
    tmpfs: [/tmp:size=64m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_started}
      mcp: {condition: service_started}

  # The RAG MCP server: retrieval over the learner's own chunks, enforcing can_read on every call.
  mcp:
    image: ${REGISTRY:?}/${REPOSITORY_PREFIX:?}/mcp:${IMAGE_TAG:?}
    restart: unless-stopped
    logging: *logging
    environment:
      SMART_TUTOR_ENVIRONMENT: prod
      SMART_TUTOR_AWS_REGION: ${AWS_REGION:?}
      AWS_REGION: ${AWS_REGION:?}
      SMART_TUTOR_KEYCLOAK_ISSUER: https://${DOMAIN:?}/auth/realms/smart-tutor
      SMART_TUTOR_KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth/realms/smart-tutor
      SMART_TUTOR_KEYCLOAK_CLIENT_ID: rag-mcp
      SMART_TUTOR_KEYCLOAK_CLIENT_SECRET: ${MCP_CLIENT_SECRET:?}
      SMART_TUTOR_KEYCLOAK_AUDIENCE: rag-mcp
      SMART_TUTOR_DATABASE_URL: ${APP_DATABASE_URL:?}  # built by deploy.sh (see there)
      SMART_TUTOR_MCP_PORT: "8000"
      SMART_TUTOR_MCP_URL: http://mcp:8000/mcp
      HOME: /tmp  # botocore looks for ~/.aws; the root filesystem is read-only
    read_only: true
    tmpfs: [/tmp:size=64m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    healthcheck:
      # No health endpoint (an unauthenticated /mcp answers 401), so check that the port accepts connections.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=5).close()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_started}

  # The worker's only way out (#153): CONNECT to its AWS endpoints and LangSmith's API, plain HTTP to the instance metadata service (the
  # instance profile's credentials); everything else gets 403. The config is an environment variable rather than a
  # file so a changed bucket or region recreates the container (Compose can't inject a config into a read-only one).
  egress-proxy:
    # Pinned by digest: the tag is Canonical's mutable edge channel; bump it deliberately.
    image: ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
    restart: unless-stopped
    logging: *logging
    entrypoint: [bash, -c, 'printf "%s" "$$SQUID_CONF" > /tmp/squid.conf && exec squid -N -f /tmp/squid.conf']
    environment:
      SQUID_CONF: |
        http_port 3128
        # Exact names, no reverse lookups (-n): not bare s3.*, whose path-style requests could name any bucket.
        acl aws dstdomain -n ${DOCUMENTS_BUCKET:?}.s3.amazonaws.com ${DOCUMENTS_BUCKET:?}.s3.${AWS_REGION:?}.amazonaws.com sqs.${AWS_REGION:?}.amazonaws.com ssm.${AWS_REGION:?}.amazonaws.com bedrock-runtime.${AWS_REGION:?}.amazonaws.com
        # The worker's ingest traces (#229).
        acl langsmith dstdomain -n api.smith.langchain.com
        acl imds dstdomain -n 169.254.169.254
        acl tls port 443
        acl http port 80
        acl CONNECT method CONNECT
        http_access allow CONNECT aws tls
        http_access allow CONNECT langsmith tls
        http_access allow !CONNECT imds http
        http_access deny all
        # IMDSv2 refuses a token request that carries X-Forwarded-For.
        forwarded_for delete
        via off
        httpd_suppress_version_string on
        cache deny all
        connect_timeout 10 seconds
        pinger_enable off
        acl healthcheck src 127.0.0.1/32 ::1
        access_log stdio:/dev/stdout !healthcheck
        cache_log stdio:/dev/stderr
        pid_filename none
        logfile_rotate 0
        shutdown_lifetime 1 seconds
    user: proxy
    read_only: true
    tmpfs: [/tmp:size=1m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    networks: [default, worker]
    healthcheck:
      # A request Squid refuses (403) without a DNS lookup: it answers, and the healthcheck ACL keeps it out of the log.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/3128 && printf 'GET http://healthcheck/ HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '^HTTP/1.1 ' <&3"
      interval: 15s
      timeout: 5s
      retries: 5

  # The ingestion worker: polls the ingest queue, extracts and embeds each uploaded PDF. It parses untrusted files, so
  # it runs with the least it needs: the image's uid 10001, a read-only root, no capabilities, and bounded CPU, memory,
  # and processes. Each PDF is extracted in a child process (SMART_TUTOR_EXTRACTION_TIMEOUT_SECONDS), which pids_limit
  # and the /tmp tmpfs leave room for.
  worker:
    image: ${REGISTRY:?}/${REPOSITORY_PREFIX:?}/worker:${IMAGE_TAG:?}
    restart: unless-stopped
    logging: *logging
    environment:
      SMART_TUTOR_ENVIRONMENT: prod
      SMART_TUTOR_DEPLOYMENT: on-premise
      # Traces (PRD §10.4, #229): tracing is off until the LangSmith API key's secret exists (deploy.sh).
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:?}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_PROJECT: smart-tutor-on-premise  # its ingest traces go to smart-tutor-on-premise-ingestion
      LANGSMITH_TRACING_SAMPLING_RATE: ${TRACE_SAMPLING_RATE:?}
      SMART_TUTOR_LEARNER_HASH_KEY: ${LEARNER_HASH_KEY:?}
      SMART_TUTOR_AWS_REGION: ${AWS_REGION:?}
      AWS_REGION: ${AWS_REGION:?}
      SMART_TUTOR_DOCUMENTS_BUCKET: ${DOCUMENTS_BUCKET:?}
      SMART_TUTOR_INGEST_QUEUE_URL: ${INGEST_QUEUE_URL:?}
      SMART_TUTOR_DATABASE_URL: ${APP_DATABASE_URL:?}  # built by deploy.sh (see there)
      SMART_TUTOR_MAX_UPLOAD_MB_PARAM: ${SSM_PATH:?}/max-upload-mb
      SMART_TUTOR_MAX_PAGES_PARAM: ${SSM_PATH:?}/max-pages
      SMART_TUTOR_EXTRACTION_TIMEOUT_SECONDS: "300"
      # Its only way out (egress-proxy); botocore also fetches the instance profile's credentials through it.
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      AWS_METADATA_SERVICE_TIMEOUT: "2"  # one more hop to IMDS than the default 1 s assumes
      AWS_METADATA_SERVICE_NUM_ATTEMPTS: "3"
      HOME: /tmp  # botocore looks for ~/.aws; the root filesystem is read-only
    networks: [worker]
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp:size=64m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 1536m
    pids_limit: 256
    stop_grace_period: 60s  # it finishes the current poll on SIGTERM
    healthcheck:
      # No HTTP server: check that PID 1 is still the worker.
      test:
        - CMD
        - python
        - -c
        - "import sys; sys.exit(b'smart_tutor.apps.worker' not in open('/proc/1/cmdline', 'rb').read())"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      egress-proxy: {condition: service_healthy}

  web:
    image: ${REGISTRY:?}/${REPOSITORY_PREFIX:?}/web:${IMAGE_TAG:?}
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5

  # One origin: `/` → web, `/api/*` → API, `/auth/*` → Keycloak; a Let's Encrypt certificate for DOMAIN (ADR 0012).
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    logging: *logging
    ports: ["80:80", "443:443"]
    environment:
      SMART_TUTOR_DOMAIN: ${DOMAIN:?}
    labels:
      # A bind-mounted file keeps its old contents after a redeploy; a changed digest recreates the container.
      smart-tutor.caddyfile-sha256: ${CADDYFILE_SHA256:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /data/caddy/data:/data  # certificates and the ACME account survive replacing the VM
      - /data/caddy/config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      web: {condition: service_started}
      api: {condition: service_started}
      keycloak: {condition: service_started}
