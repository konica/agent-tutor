# Production overrides (us-east-1). The deploy sets global.imageRegistry and global.imageTag
# (helm upgrade --set global.imageRegistry=<RegistryUri> --set global.imageTag=<commit sha>).
# It also sets global.publicUrl (--set global.publicUrl=<Edge output CloudFrontUrl>).
# The pilot (#54) runs only the US-1 services; each is enabled by its slice.
global:
  secretStore: aws-secrets-manager
  langsmith:
    project: smart-tutor-native-cloud  # needs the secret smart-tutor/langsmith/api-key (pilot-deploy.md)
dbBootstrap:
  enabled: true
web:
  replicaCount: 2
  targetGroupName: smart-tutor-prod-web  # SmartTutor-prod-Edge output WebTargetGroupName
keycloak:
  enabled: true
  targetGroupName: smart-tutor-prod-keycloak  # SmartTutor-prod-Edge output KeycloakTargetGroupName
api:
  enabled: true
  replicaCount: 2
  targetGroupName: smart-tutor-prod-api  # SmartTutor-prod-Edge output ApiTargetGroupName
jobs:
  enabled: true  # the migrate hook; CronJobs come with their slices
agent:
  enabled: true
  replicaCount: 2
mcp-server:
  enabled: true
worker:
  enabled: true
