# Shared defaults for every environment. Overrides: values-prod.yaml.
global:
  imageRegistry: ""  # ECR registry, set per environment
  imageTag: latest
  # Address the browser uses, e.g. https://d111.cloudfront.net (SmartTutor-prod-Edge output CloudFrontUrl).
  # Set at deploy time with --set global.publicUrl=...; Keycloak won't start without it.
  publicUrl: ""
  # SecretStore that ExternalSecrets read from (AWS Secrets Manager); empty renders no SecretStore or ExternalSecrets.
  secretStore: ""
  # SmartTutor-prod-Storage outputs DocumentsBucketName and IngestQueueUrl, set at deploy time with --set. The API
  # and worker won't render for AWS without them.
  documentsBucket: ""
  ingestQueueUrl: ""
  # Question screen (#199) for the agent: mode is "off" or "bedrock"; "bedrock" needs the guardrail id and version. The
  # deploy passes the SSM parameters question-guard, question-guardrail-id, and question-guardrail-version.
  questionGuard:
    mode: "off"
    guardrailId: ""
    guardrailVersion: ""

awsRegion: us-east-1

# Creates the app and Keycloak roles and databases on RDS before each install and upgrade (files/db-bootstrap.sql).
dbBootstrap:
  enabled: false
  image: postgres:17-alpine

api:
  enabled: true

agent:
  enabled: true

mcp-server:
  enabled: true

worker:
  enabled: true

web:
  enabled: true

jobs:
  enabled: true

keycloak:
  enabled: true
