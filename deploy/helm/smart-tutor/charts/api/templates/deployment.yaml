{{- if and .Values.global.secretStore (not .Values.global.publicUrl) }}
{{- fail "api needs global.publicUrl on AWS: without it the issuer is wrong and every token is rejected" }}
{{- end }}
{{- if and .Values.global.secretStore (not .Values.global.documentsBucket) }}
{{- fail "api needs global.documentsBucket on AWS (SmartTutor-prod-Storage output DocumentsBucketName)" }}
{{- end }}
{{- if and .Values.global.secretStore (not .Values.global.ingestQueueUrl) }}
{{- fail "api needs global.ingestQueueUrl on AWS (SmartTutor-prod-Storage output IngestQueueUrl)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "api.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "api.labels" . | nindent 8 }}
    spec:
      serviceAccountName: api  # Pod Identity (ClusterStack) gives it the SSM read role
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ include "api.image" . }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SMART_TUTOR_ENVIRONMENT
              value: prod
            - name: SMART_TUTOR_ROOT_PATH
              value: {{ .Values.rootPath | quote }}
            - name: SMART_TUTOR_AWS_REGION
              value: {{ .Values.awsRegion | quote }}
            - name: SMART_TUTOR_KEYCLOAK_ISSUER
              value: {{ printf "%s/auth/realms/smart-tutor" (trimSuffix "/" (.Values.global.publicUrl | default "")) | quote }}
            - name: SMART_TUTOR_KEYCLOAK_INTERNAL_URL
              value: {{ .Values.keycloakInternalUrl | quote }}
            - name: SMART_TUTOR_KEYCLOAK_CLIENT_ID
              value: {{ .Values.keycloakClientId | quote }}
            - name: SMART_TUTOR_KEYCLOAK_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: api-keycloak, key: client-secret}}
            - name: SMART_TUTOR_AGENT_URL
              value: {{ .Values.agentUrl | quote }}
            - name: SMART_TUTOR_DATABASE_URL
              valueFrom: {secretKeyRef: {name: api-db, key: url}}
            - name: SMART_TUTOR_CORS_ORIGINS
              value: "[]"  # the web app calls /api on its own origin
            - name: SMART_TUTOR_DOCUMENTS_BUCKET
              value: {{ .Values.global.documentsBucket | quote }}
            - name: SMART_TUTOR_INGEST_QUEUE_URL
              value: {{ .Values.global.ingestQueueUrl | quote }}
            - name: HOME
              value: /tmp  # botocore looks for ~/.aws; the root filesystem is read-only
          # /healthz needs neither a token nor Keycloak, so a Keycloak restart doesn't take the API out of service.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
