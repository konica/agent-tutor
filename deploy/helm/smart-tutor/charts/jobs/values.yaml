# The migrate hook (#58), and later the CronJobs (PRD §9.1): learning-record sweeper (every minute), Glacier tagger
# (daily), retention of traces and decline log (daily), (R3) learner reports (hourly). All reuse the api image.
image:
  repository: smart-tutor/api
  tag: ""  # defaults to global.imageTag
# Secrets Manager entry of the app database (CDK DataStack), read through global.secretStore.
secrets:
  database: smart-tutor/db/app
schedules:
  recordSweeper: "* * * * *"
  glacierTagger: "0 3 * * *"
  retention: "30 3 * * *"
