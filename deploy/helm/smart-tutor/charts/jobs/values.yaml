# CronJobs: learning-record sweeper (every minute), Glacier tagger (daily), (R2) learner reports.
image:
  repository: smart-tutor-api
  tag: ""  # defaults to global.imageTag
schedules:
  recordSweeper: "* * * * *"
  glacierTagger: "0 3 * * *"
# Owns its NetworkPolicy and ExternalSecret (spec §8).
