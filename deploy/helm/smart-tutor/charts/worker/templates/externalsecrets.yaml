{{- if .Values.global.secretStore }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: worker-db
  labels:
    {{- include "worker.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.global.secretStore }}
    kind: SecretStore
  target:
    name: worker-db
    template:
      data:
        url: {{ "postgresql+psycopg://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}?sslmode=require" | quote }}
  dataFrom:
    - extract:
        key: {{ .Values.secrets.database }}
{{- if .Values.global.langsmith.project }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: worker-langsmith
  labels:
    {{- include "worker.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.global.secretStore }}
    kind: SecretStore
  target:
    name: worker-langsmith
  data:
    - secretKey: api-key
      remoteRef:
        key: {{ .Values.secrets.langsmithApiKey }}
    - secretKey: learner-hash-key
      remoteRef:
        key: {{ .Values.secrets.learnerHashKey }}
{{- end }}
{{- end }}
