{{- if .Values.global.secretStore }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.global.secretStore }}
    kind: SecretStore
  target:
    name: keycloak-db
    template:
      data:
        url: {{ "jdbc:postgresql://{{ .host }}:{{ .port }}/{{ .dbname }}?sslmode=require" | quote }}
        username: {{ "{{ .username }}" | quote }}
        password: {{ "{{ .password }}" | quote }}
  dataFrom:
    - extract:
        key: {{ .Values.secrets.database }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.global.secretStore }}
    kind: SecretStore
  target:
    name: keycloak-admin
  dataFrom:
    - extract:
        key: {{ .Values.secrets.admin }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-clients
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.global.secretStore }}
    kind: SecretStore
  target:
    name: keycloak-clients
  data:
    - secretKey: api-client-secret
      remoteRef:
        key: {{ .Values.secrets.apiClient }}
    - secretKey: mcp-client-secret
      remoteRef:
        key: {{ .Values.secrets.mcpClient }}
{{- end }}
