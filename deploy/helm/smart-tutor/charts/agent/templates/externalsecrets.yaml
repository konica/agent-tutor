{{- if .Values.global.secretStore }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-db
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.global.secretStore }}
    kind: SecretStore
  target:
    name: agent-db
    template:
      data:
        url: {{ "postgresql+psycopg://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}?sslmode=require" | quote }}
  dataFrom:
    - extract:
        key: {{ .Values.secrets.database }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-keycloak
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.global.secretStore }}
    kind: SecretStore
  target:
    name: agent-keycloak
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ .Values.secrets.keycloakClient }}
{{- end }}
