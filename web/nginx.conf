server {
  listen 8080;
  root /usr/share/nginx/html;

  # nginx's map lacks .mjs, so the pdf.js worker went out as application/octet-stream and the browser refused to run
  # it as a module: no document could open. A types block replaces the inherited map, so include it first.
  include mime.types;
  types { text/javascript mjs; }

  # Hashed bundles never change; index.html must be revalidated so a deploy shows at once (CloudFront honors these).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;  # single-page app routing
  }
}
