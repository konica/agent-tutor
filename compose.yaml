# Local development (PRD §9.12).
#   docker compose up -d                 # dependencies only: pgvector, Keycloak, LocalStack, Mailpit
#   docker compose --profile app up -d   # + app services from the same images as production
# Bedrock and LangSmith have no emulator: agent and mcp call the real us-east-1 models with your AWS profile.

name: smart-tutor

# The api (subject-name embeddings), worker, agent (chat model) and mcp (query embeddings) call Bedrock: they
# mount your AWS config read-only. The api and worker sign S3/SSM/SQS with dummy keys (SMART_TUTOR_LOCALSTACK),
# so your real keys never reach LocalStack.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: smart_tutor
      POSTGRES_PASSWORD: smart_tutor
      POSTGRES_DB: smart_tutor
    ports: ["10400:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./local/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_tutor -d smart_tutor"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: smart_tutor
      KC_DB_PASSWORD: smart_tutor
      KC_HEALTH_ENABLED: "true"
      # Tokens are issued to the browser at localhost:10401; containers introspect them at keycloak:8080.
      # Without a pinned hostname Keycloak reports such tokens as inactive (ADR 0007).
      KC_HOSTNAME: http://localhost:10401
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports: ["10401:8080"]
    volumes:
      - ./local/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres: {condition: service_healthy}
      mailpit: {condition: service_started}

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: s3,sqs,ssm,secretsmanager
      AWS_DEFAULT_REGION: us-east-1
    ports: ["10402:4566"]
    volumes:
      - ./local/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    # Healthy only once the ready.d init script has seeded settings (it sets max-pages last, or at least by the end);
    # the api and worker read SSM at startup and exit when a parameter is missing.
    healthcheck:
      test: ["CMD", "awslocal", "ssm", "get-parameter", "--name", "/smart-tutor/max-pages"]
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 10s

  # Catches Keycloak's emails (sign-up verification). Web UI at http://localhost:10403; SMTP stays on the network.
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["10403:8025"]

  # --- app profile: same images as production -------------------------------------------
  migrate:
    profiles: [app]
    build: {context: ./backend, target: api}
    command: ["python", "-m", "smart_tutor.apps.jobs.migrate"]
    environment:
      SMART_TUTOR_DATABASE_URL: postgresql+psycopg://smart_tutor:smart_tutor@postgres:5432/smart_tutor
    depends_on:
      postgres: {condition: service_healthy}

  api:
    profiles: [app]
    build: {context: ./backend, target: api}
    env_file: [{path: .env, required: false}]
    environment:
      SMART_TUTOR_DATABASE_URL: postgresql+psycopg://smart_tutor:smart_tutor@postgres:5432/smart_tutor
      SMART_TUTOR_KEYCLOAK_ISSUER: http://localhost:10401/realms/smart-tutor
      SMART_TUTOR_KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/smart-tutor
      SMART_TUTOR_KEYCLOAK_CLIENT_ID: smart-tutor-api
      SMART_TUTOR_KEYCLOAK_CLIENT_SECRET: local-api-secret
      # The API only signs presigned POSTs; the browser sends them, so sign for the URL it can reach.
      AWS_ENDPOINT_URL_S3: http://localhost:10402
      # SSM is read by the API itself, so it uses the in-network endpoint.
      AWS_ENDPOINT_URL_SSM: http://localstack:4566
      # Retry sends a message to the worker's queue (PRD §9.5).
      SMART_TUTOR_INGEST_QUEUE_URL: http://localstack:4566/000000000000/smart-tutor-ingest
      AWS_ENDPOINT_URL_SQS: http://localstack:4566
      SMART_TUTOR_S3_PATH_STYLE: "true"
      SMART_TUTOR_AGENT_URL: http://agent:8080
      SMART_TUTOR_LOCALSTACK: "true"
      # The api signs S3/SSM with dummy keys (SMART_TUTOR_LOCALSTACK), so your real keys never reach LocalStack.
      # It also calls Bedrock to embed subject names, with AWS_PROFILE and SMART_TUTOR_AWS_REGION from .env.
      # botocore reads config, credentials and the SSO / `aws login` caches under $HOME/.aws; the image user
      # (uid 10001) has no home, so give it one and mount your ~/.aws there. The mount is read-only, so SSO
      # token refresh can't write its cache: run `aws sso login` / `aws login` on the host first.
      HOME: /home/app
    volumes: ["~/.aws:/home/app/.aws:ro"]
    ports: ["10450:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      keycloak: {condition: service_started}
      agent: {condition: service_started}
      localstack: {condition: service_healthy}

  agent:
    profiles: [app]
    build: {context: ./backend, target: agent}
    env_file: [{path: .env, required: false}]
    environment:
      SMART_TUTOR_DATABASE_URL: postgresql+psycopg://smart_tutor:smart_tutor@postgres:5432/smart_tutor
      SMART_TUTOR_KEYCLOAK_ISSUER: http://localhost:10401/realms/smart-tutor
      SMART_TUTOR_KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/smart-tutor
      SMART_TUTOR_KEYCLOAK_CLIENT_ID: smart-tutor-api
      SMART_TUTOR_KEYCLOAK_CLIENT_SECRET: local-api-secret
      SMART_TUTOR_MCP_URL: http://mcp:8000/mcp
      # Bedrock (chat model) with your AWS profile: same setup as the worker below.
      HOME: /home/app
    volumes: ["~/.aws:/home/app/.aws:ro"]
    ports: ["10451:8080"]
    depends_on: [postgres, mcp]

  mcp:
    profiles: [app]
    build: {context: ./backend, target: mcp}
    env_file: [{path: .env, required: false}]
    environment:
      SMART_TUTOR_DATABASE_URL: postgresql+psycopg://smart_tutor:smart_tutor@postgres:5432/smart_tutor
      SMART_TUTOR_KEYCLOAK_ISSUER: http://localhost:10401/realms/smart-tutor
      SMART_TUTOR_KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/smart-tutor
      SMART_TUTOR_KEYCLOAK_CLIENT_ID: rag-mcp
      SMART_TUTOR_KEYCLOAK_CLIENT_SECRET: local-mcp-secret
      SMART_TUTOR_KEYCLOAK_AUDIENCE: rag-mcp
      SMART_TUTOR_MCP_PORT: "8000"  # .env sets the host port (10452)
      # The resource server URL in the MCP auth metadata: the address the agent calls, not .env's host URL.
      SMART_TUTOR_MCP_URL: http://mcp:8000/mcp
      # Bedrock (query embeddings) with your AWS profile: same setup as the worker below.
      HOME: /home/app
    volumes: ["~/.aws:/home/app/.aws:ro"]
    ports: ["10452:8000"]
    depends_on: [postgres]

  worker:
    profiles: [app]
    build: {context: ./backend, target: worker}
    env_file: [{path: .env, required: false}]
    environment:
      SMART_TUTOR_DATABASE_URL: postgresql+psycopg://smart_tutor:smart_tutor@postgres:5432/smart_tutor
      SMART_TUTOR_INGEST_QUEUE_URL: http://localstack:4566/000000000000/smart-tutor-ingest
      AWS_ENDPOINT_URL_S3: http://localstack:4566
      AWS_ENDPOINT_URL_SQS: http://localstack:4566
      AWS_ENDPOINT_URL_SSM: http://localstack:4566
      SMART_TUTOR_S3_PATH_STYLE: "true"
      SMART_TUTOR_LOCALSTACK: "true"
      # Bedrock uses AWS_PROFILE and SMART_TUTOR_AWS_REGION (Settings.aws_region) from .env. botocore reads
      # config, credentials and the SSO / `aws login` caches under $HOME/.aws; the image user (uid 10001) has no
      # home, so give it one and mount your ~/.aws there. The mount is read-only, so SSO token refresh can't write
      # its cache: run `aws sso login` / `aws login` on the host first.
      HOME: /home/app
    volumes: ["~/.aws:/home/app/.aws:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      localstack: {condition: service_healthy}

  web:
    profiles: [app]
    build: {context: ./web}
    ports: ["10453:8080"]

volumes:
  pgdata:
