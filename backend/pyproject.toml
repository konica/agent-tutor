# Rule 5: the module dependency graph, top to bottom. Higher modules may use lower ones (application only);
# "|" marks independent siblings. Lower never imports higher, so there are no cycles.
# A new cross-module dependency means editing this order on purpose.
[[tool.importlinter.contracts]]
name = "Module dependency graph"
type = "layers"
containers = ["smart_tutor"]
layers = [
    "reports",
    "recommendations",
    "quizzes | catalog",
    "learning",
    "tutoring",
    "graph",
    "knowledge",
    "accounts | insights",
]
