]
forbidden_modules = ["langchain_text_splitters", "pypdf"]

# ADR 0017: runtime traces go to Phoenix; only backend/evals (outside smart_tutor) uses LangSmith.
[[tool.importlinter.contracts]]
name = "Runtime code never imports LangSmith"
type = "forbidden"
source_modules = ["smart_tutor"]
forbidden_modules = ["langsmith"]
allow_indirect_imports = true  # langchain_core imports it itself

# Rule 5: the module dependency graph, top to bottom. Higher modules may use lower ones (application only);
# "|" marks independent siblings. Lower never imports higher, so there are no cycles.
# A new cross-module dependency means editing this order on purpose.
[[tool.importlinter.contracts]]
name = "Module dependency graph"
type = "layers"
containers = ["smart_tutor"]
layers = [
    "reports",
    "recommendations",
    "quizzes | catalog",
    "learning",
    "tutoring",
    "graph",
    "knowledge",
    "subjects",
    "accounts | insights",
]
