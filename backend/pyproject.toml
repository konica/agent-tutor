[project]
name = "smart-tutor"
version = "0.1.0"
description = "Smart Tutor: subject-scoped AI tutor (API, agent, RAG MCP server, ingestion worker, jobs)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "boto3>=1.40",
    "fastapi>=0.115",
    "httpx>=0.28",
    "langchain-aws>=0.2",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "langsmith>=0.4",
    "mcp>=2.2",
    "pgvector>=0.4",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyjwt[crypto]>=2.10",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
# Installed only in the worker image (pulls in PyTorch).
ingest = ["docling>=2.40"]
# Evaluation runs (backend/evals) and CI eval gates.
eval = ["openevals>=0.1", "pyyaml>=6.0"]

[dependency-groups]
dev = [
    "import-linter>=2.3",
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["smart_tutor", "fakes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration' --import-mode=importlib"
pythonpath = ["tests"]  # so tests can `import fakes`
markers = ["integration: needs the Docker Compose stack (make up)"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# ---------------------------------------------------------------------------
# Import rules (sdd/specs/2026-10-02-project-structure-design.md §6). Run: lint-imports
# Generated from one module list; keep MODULES and the dependency order in sync with the spec.
# R1: knowledge tutoring learning accounts insights | R2 (+R5): graph | R3: catalog quizzes recommendations reports
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "smart_tutor"
include_external_packages = true

# Rule 1: layers inside every module.
[[tool.importlinter.contracts]]
name = "Layers inside each module: adapters | application -> ports -> domain"
type = "layers"
layers = ["adapters | application", "ports", "domain"]
containers = [
    "smart_tutor.knowledge",
    "smart_tutor.tutoring",
    "smart_tutor.learning",
    "smart_tutor.accounts",
    "smart_tutor.insights",
    "smart_tutor.catalog",
    "smart_tutor.quizzes",
    "smart_tutor.recommendations",
    "smart_tutor.reports",
    "smart_tutor.graph",
]

[[tool.importlinter.contracts]]
name = "Layers inside shared: adapters -> ports -> domain"
type = "layers"
layers = ["adapters", "ports", "domain"]
containers = ["smart_tutor.shared"]

# Rule 2: a module's domain, ports, and adapters are private; others use its application layer only.
[[tool.importlinter.contracts]]
name = "knowledge internals are private"
type = "forbidden"
source_modules = [
    "smart_tutor.tutoring",
    "smart_tutor.learning",
    "smart_tutor.accounts",
    "smart_tutor.insights",
    "smart_tutor.catalog",
    "smart_tutor.quizzes",
    "smart_tutor.recommendations",
    "smart_tutor.reports",
    "smart_tutor.graph",
]
forbidden_modules = [
    "smart_tutor.knowledge.domain",
    "smart_tutor.knowledge.ports",
    "smart_tutor.knowledge.adapters",
]

