[[tool.importlinter.contracts]]
name = "PDF loader only in knowledge.adapters (keeps the ingest extra in the worker image)"
type = "forbidden"
# Only the worker image installs the ingest extra, so only its composition root may build these adapters.
ignore_imports = [
    "smart_tutor.apps.worker.main -> smart_tutor.knowledge.adapters.pypdf_extractor",
    "smart_tutor.apps.worker.main -> smart_tutor.knowledge.adapters.chunking",
]
source_modules = [
    "smart_tutor.shared",
    "smart_tutor.apps",
    "smart_tutor.subjects",
    "smart_tutor.tutoring",
    "smart_tutor.learning",
