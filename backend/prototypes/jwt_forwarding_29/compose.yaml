# PROTOTYPE (#29) — throwaway. Run from the repo root (joins the normal Compose stack's network):
#   docker compose -f compose.yaml -f backend/prototypes/jwt_forwarding_29/compose.yaml \
#     up -d --build --no-deps keycloak proto-api proto-agent proto-mcp
#   cd backend && uv run python prototypes/jwt_forwarding_29/setup_keycloak.py   # client secrets
#   cd backend && uv run python prototypes/jwt_forwarding_29/run.py

x-env: &env
  # Issuer = what the browser sees; internal URL = what a container can reach.
  PROTO_ISSUER: http://localhost:8080/realms/smart-tutor
  PROTO_KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/smart-tutor
  PROTO_MCP_URL: http://proto-mcp:8000/mcp
  PROTO_AGENT_URL: http://proto-agent:8080
  LANGSMITH_TRACING: "false"
  PYTHONUNBUFFERED: "1"

x-proto: &proto
  build: {context: ./backend, target: deps}
  working_dir: /proto
  volumes: ["./backend/prototypes/jwt_forwarding_29:/proto:ro"]
  depends_on: [keycloak]

services:
  # Introspection only says active=true when the request's hostname gives the token's issuer.
  # Pin the public hostname; let containers still reach Keycloak as keycloak:8080 (backchannel).
  keycloak:
    environment:
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"

  proto-mcp:
    <<: *proto
    command: ["/app/.venv/bin/python", "mcp_server.py"]
    environment: {<<: *env, PROTO_CLIENT_ID: rag-mcp, PROTO_CLIENT_SECRET: proto-mcp-secret}
    ports: ["9000:8000"]
  proto-agent:
    <<: *proto
    command: ["/app/.venv/bin/uvicorn", "agent:app", "--host", "0.0.0.0", "--port", "8080"]
    environment: {<<: *env, PROTO_CLIENT_ID: smart-tutor-api, PROTO_CLIENT_SECRET: proto-api-secret}
    ports: ["9002:8080"]
  proto-api:
    <<: *proto
    command: ["/app/.venv/bin/uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8080"]
    environment: {<<: *env, PROTO_CLIENT_ID: smart-tutor-api, PROTO_CLIENT_SECRET: proto-api-secret}
    ports: ["9001:8080"]
