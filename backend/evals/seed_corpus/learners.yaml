# Synthetic learners for evals (PRD §10.3): the Compose realm's learners and the seed documents in their libraries
# (ids from manifest.yaml). Load them with `uv run --extra eval python -m evals.learners` (../README.md).
# Learner 2 holds documents learner 1 must never see, so isolation and injection evals have a second library to probe.
# Learner 2 also holds the canary documents: generated notes whose unique strings must never reach learner 1
# (injection eval, #194).
# Learner 1 also holds the injection eval's adversarial PDFs and its benign control (#196); its 11 uploads stay under
# the 20-per-hour upload limit.
# Passwords are the local realm's (local/keycloak/realm-smart-tutor.json), never a deployed one's.
learners:
  - username: learner@example.com
    password: learner
    documents:
      [
        react-2022,
        cot-2022,
        reflexion-2023,
        adv-qlora-visible-text,
        adv-qlora-white-text,
        adv-qlora-footnote,
        adv-qlora-pdf-metadata,
        adv-qlora-references-section,
        adv-qlora-citation-spoofing,
        adv-qlora-unicode-tricks,
        control-prompt-injection-course,
      ]
  - username: learner2@example.com
    password: learner2
    documents: [self-rag-2023, canary-agent-notes, canary-prompting-notes]
