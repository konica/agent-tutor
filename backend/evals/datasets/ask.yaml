      covered: true
      sources: [wikiskill-2026]
      answer: "WikiSkill splits its workspace into a Raw Layer that stores immutable execution traces, a Wiki Layer that keeps structured knowledge, and a Skill Layer that holds the evolving procedural knowledge (the skills)."
      nuggets:
        - {fact: "The Raw Layer stores immutable execution traces.", evidence: [0]}
        - {fact: "The Wiki Layer maintains structured knowledge.", evidence: [0]}
        - {fact: "The Skill Layer contains evolving procedural knowledge.", evidence: [0]}
      evidence:
