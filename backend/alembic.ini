# Migrations live in the package so every image can run them: python -m smart_tutor.apps.jobs.migrate
# The database URL comes from Settings (SMART_TUTOR_DATABASE_URL), not from this file.
[alembic]
script_location = %(here)s/src/smart_tutor/shared/adapters/postgres/migrations
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
