# Every push to main: the CI checks, then the pilot deploy (PRD §9.12, #59). Runbook: docs/runbooks/pilot-deploy.md.
name: deploy

on:
  push:
    branches: [main]

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  deploy:
    # Set the repository variable NATIVE_CLOUD_AUTO_DEPLOY to `false` while the pilot is torn down
    # (docs/runbooks/pilot-teardown.md), or the next merge rebuilds it. Unset keeps deploying (#150 makes it opt-in).
    if: vars.NATIVE_CLOUD_AUTO_DEPLOY != 'false'
    needs: checks
    permissions:
      contents: read
      id-token: write  # OIDC sign-in to AWS, used only inside the `pilot` environment
    uses: ./.github/workflows/deploy-pilot.yml
    with:
      image_tag: ${{ github.sha }}
      build: true
