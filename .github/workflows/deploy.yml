# Every push to main: the CI checks, then per deployed mode its images (built into that mode's own repositories, #206)
# and its deploy. On-premise deploys on every push (PRD §9.12, ADR 0012, #150) unless the repository variable
# ON_PREMISE_AUTO_DEPLOY is `false`, which an operator sets while on-premise is torn down (#207).
# Native-cloud is opt-in: run this workflow by hand with mode native-cloud, or set the repository variable
# NATIVE_CLOUD_AUTO_DEPLOY to `true` to deploy it on every push as well (unset or anything else keeps it off).
# Runbooks: docs/runbooks/on-premise-deploy.md, docs/runbooks/pilot-deploy.md (native-cloud).
# Jobs that call an environment workflow pass `secrets: inherit`: a called workflow sees no secret the caller doesn't
# pass, not even its environment's own AWS_ROLE_ARN (it would be an empty string, with no error).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Deployment mode to deploy this commit to
        type: choice
        options: [on-premise, native-cloud]
        default: on-premise

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Each mode's images go to its own repositories with its own deploy role (#206), so a push that deploys both modes
  # builds twice.
  images-on-premise:
    needs: checks
    if: (github.event_name == 'push' && vars.ON_PREMISE_AUTO_DEPLOY != 'false') || inputs.mode == 'on-premise'
    permissions:
      contents: read
      id-token: write  # OIDC sign-in to AWS, used only inside the `on-premise` environment
    uses: ./.github/workflows/build-images.yml
    secrets: inherit
    with:
      image_tag: ${{ github.sha }}
      environment: on-premise

  images-native-cloud:
    needs: checks
    if: (github.event_name == 'push' && vars.NATIVE_CLOUD_AUTO_DEPLOY == 'true') || inputs.mode == 'native-cloud'
    permissions:
      contents: read
      id-token: write  # OIDC sign-in to AWS, used only inside the `native-cloud` environment
    uses: ./.github/workflows/build-images.yml
    secrets: inherit
    with:
      image_tag: ${{ github.sha }}
      environment: native-cloud

  on-premise:
    needs: images-on-premise
    if: (github.event_name == 'push' && vars.ON_PREMISE_AUTO_DEPLOY != 'false') || inputs.mode == 'on-premise'
    permissions:
      contents: read
      id-token: write  # OIDC sign-in to AWS, used only inside the `on-premise` environment
    uses: ./.github/workflows/deploy-on-premise.yml
    secrets: inherit
    with:
      image_tag: ${{ github.sha }}
      infrastructure: true

  native-cloud:
    needs: images-native-cloud
    if: (github.event_name == 'push' && vars.NATIVE_CLOUD_AUTO_DEPLOY == 'true') || inputs.mode == 'native-cloud'
    permissions:
      contents: read
      id-token: write  # OIDC sign-in to AWS, used only inside the `native-cloud` environment
    uses: ./.github/workflows/deploy-native-cloud.yml
    secrets: inherit
    with:
      image_tag: ${{ github.sha }}
      infrastructure: true
