# Redeploys an earlier commit's images, without CDK or a build (#59, #150). Runbooks: docs/runbooks/on-premise-deploy.md
# (on-premise keeps the deploy files of the last cdk deploy), docs/runbooks/pilot-deploy.md (native-cloud).
# Each mode checks for the images in its own repositories (#206).
# The deploy environments only accept runs from main: start it from main with the SHA to go back to.
# Nothing is redeployed unless the repository variable PRODUCTION_DEPLOY is `true` (#282); the run then fails and says so.
name: rollback

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Deployment mode to roll back
        type: choice
        options: [on-premise, native-cloud]
        default: on-premise
      image_tag:
        description: Full commit SHA of an earlier deploy of this mode (its images must still be in the mode's ECR repositories)
        type: string
        required: true

jobs:
  # Reports the production deploy switch (#282). The environment workflows enforce it; this job only makes it visible.
  production-switch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report the production deploy switch
        env:
          SWITCH: ${{ vars.PRODUCTION_DEPLOY }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "${SWITCH,,}" = true ]; then
            echo "Production deploys are ON (PRODUCTION_DEPLOY=true)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          msg="Production deploys are OFF (PRODUCTION_DEPLOY is not true). Nothing was deployed."
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT" = push ]; then echo "::notice title=Production deploys off::$msg"; exit 0; fi
          echo "::error title=Production deploys off::$msg"
          exit 1

  on-premise:
    if: inputs.mode == 'on-premise'
    permissions:
      contents: read
      id-token: write  # OIDC sign-in to AWS, used only inside the `on-premise` environment
    uses: ./.github/workflows/deploy-on-premise.yml
    secrets: inherit  # the environment's AWS_ROLE_ARN reaches a called workflow only this way
    with:
      image_tag: ${{ inputs.image_tag }}
      infrastructure: false

  native-cloud:
    if: inputs.mode == 'native-cloud'
    permissions:
      contents: read
      id-token: write  # OIDC sign-in to AWS, used only inside the `native-cloud` environment
    uses: ./.github/workflows/deploy-native-cloud.yml
    secrets: inherit  # the environment's AWS_ROLE_ARN reaches a called workflow only this way
    with:
      image_tag: ${{ inputs.image_tag }}
      infrastructure: false
