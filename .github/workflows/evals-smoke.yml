# Runs the smoke split (PRD §10.3, #226, #320) on pull requests that change the agent, and by hand from the Actions
# tab: starts the Compose app stack, loads the eval learners' libraries, runs the split as Langfuse experiments in the
# smart-tutor-evals project, and gates on thresholds.yaml. The gate table and the experiment links go to the job
# summary; a breached threshold fails the check.
# Needs the repository secret EVALS_AWS_ROLE_ARN (a Bedrock-only role trusted through GitHub OIDC), the secrets
# LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY (a key pair of smart-tutor-evals), and the repository variable
# LANGFUSE_BASE_URL (docs/runbooks/evals-ci.md). Without them (a fork, Dependabot, or before they exist) the job skips
# and says why. While the Langfuse host is off (18:00-07:00 Asia/Ho_Chi_Minh) the job fails within a minute, before
# any Bedrock spend (ADR 0023).
name: evals-smoke

on:
  pull_request:
    paths:
      - backend/src/smart_tutor/tutoring/**
      - backend/src/smart_tutor/apps/agent/**
      - backend/src/smart_tutor/apps/mcp_server/**
      - backend/src/smart_tutor/shared/config.py
      - backend/src/smart_tutor/shared/adapters/model_factory.py
      - backend/src/smart_tutor/shared/adapters/bedrock/**
      - backend/src/smart_tutor/knowledge/application/search_service.py
      - backend/src/smart_tutor/knowledge/adapters/sql_library.py
      - backend/src/smart_tutor/knowledge/adapters/chunking.py
      - backend/evals/**
      - backend/models/**
      - .env.example
      - compose.yaml
      - compose.ci.yaml
      - .github/workflows/evals-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

# One run per pull request (or branch); a newer push cancels the run it replaces.
concurrency:
  group: evals-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60  # the role's session lasts 1 hour
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Forks and Dependabot get neither secrets nor an OIDC token: skip with a reason instead of failing.
      - name: Check access to the eval secrets
        id: access
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          HAS_ROLE: ${{ secrets.EVALS_AWS_ROLE_ARN != '' }}
          HAS_KEYS: ${{ secrets.LANGFUSE_PUBLIC_KEY != '' && secrets.LANGFUSE_SECRET_KEY != '' }}
          HAS_URL: ${{ vars.LANGFUSE_BASE_URL != '' }}
        run: |
          skip() {
            echo "$1 title=Smoke evals skipped::$2"
            printf '### Smoke evals skipped\n\n%s\n' "$2" >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [[ -n "$HEAD_REPO" && "$HEAD_REPO" != "$REPO" ]]; then
            skip ::notice "This pull request comes from a fork, which can't use the eval role or the Langfuse keys. A maintainer can push its branch to $REPO, or run evals-smoke on such a branch from the Actions tab."
          fi
          [[ "$HAS_ROLE" == true ]] || skip ::warning "The secret EVALS_AWS_ROLE_ARN isn't set (docs/runbooks/evals-ci.md)."
          [[ "$HAS_KEYS" == true ]] || skip ::warning "The secrets LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY aren't available to this run (not set, or a Dependabot pull request; docs/runbooks/evals-ci.md)."
          [[ "$HAS_URL" == true ]] || skip ::warning "The repository variable LANGFUSE_BASE_URL isn't set (docs/runbooks/evals-ci.md)."
          echo "run=true" >> "$GITHUB_OUTPUT"

      # The Langfuse host is off 18:00-07:00 (ADR 0022). Fail now, before building or calling Bedrock, rather than skip:
      # an agent change merged at night must not pass the gate unseen (ADR 0023). CI doesn't start the host.
      - name: Check that Langfuse is up
        if: steps.access.outputs.run == 'true'
        env:
          LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
        run: |
          for attempt in 1 2 3; do
            curl -fsS -o /dev/null --max-time 10 "${LANGFUSE_BASE_URL%/}/api/public/health" && exit 0
            [[ $attempt == 3 ]] || sleep 5
          done
          message="Langfuse is off 18:00–07:00 Asia/Ho_Chi_Minh: re-run this job after 07:00, or start the host (\`docs/runbooks/langfuse-host.md\`)"
          echo "::error title=Langfuse is not answering::$message"
          printf '### Smoke evals: Langfuse is not answering\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: steps.access.outputs.run == 'true'

      # The local defaults, minus the developer profile (botocore then uses the OIDC session from the environment) and
      # the developer's Langfuse lines (the run step sets them from the secrets and the variable).
      - name: Prepare .env
        if: steps.access.outputs.run == 'true'
        run: |
          grep -v -e '^AWS_PROFILE=' -e '^LANGFUSE_' .env.example > .env
          mkdir -p ~/.aws  # compose.yaml mounts it; an empty folder, not one Docker creates as root

      - name: Install the eval dependencies
        if: steps.access.outputs.run == 'true'
        working-directory: backend
        run: uv sync --frozen --extra eval --extra ingest --extra guard --extra topic

      - name: Build the app images
        if: steps.access.outputs.run == 'true'
        run: docker compose -f compose.yaml -f compose.ci.yaml --profile app build migrate api agent mcp worker

      - name: Sign in to AWS (Bedrock only)
        if: steps.access.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.EVALS_AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Start the stack
        if: steps.access.outputs.run == 'true'
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml --profile app up -d api worker mcp
          wait_for() {
            for _ in $(seq 90); do curl -fs -o /dev/null "$1" && return 0; sleep 2; done
            echo "::error::$1 didn't answer within 3 minutes"; return 1
          }
          wait_for http://localhost:10450/healthz
          wait_for http://localhost:10401/realms/smart-tutor
          # The ask graph runs on the runner (evals/targets.py); only MCP must be up. It has no health route and answers 4xx.
          for _ in $(seq 90); do
            [[ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:10452/mcp)" != 000 ]] && exit 0
            sleep 2
          done
          echo "::error::http://localhost:10452/mcp didn't answer within 3 minutes"; exit 1

      - name: Load the eval learners' libraries
        if: steps.access.outputs.run == 'true'
        working-directory: backend
        run: uv run --extra eval --extra ingest python -m evals.learners --timeout 600

      - name: Run the smoke split
        if: steps.access.outputs.run == 'true'
        working-directory: backend
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
        run: uv run --env-file ../.env --extra eval --extra guard --extra topic python -m evals.run --split smoke --environment ci --summary "$GITHUB_STEP_SUMMARY"

      - name: Service logs
        if: (failure() || cancelled()) && steps.access.outputs.run == 'true'
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml --profile app ps -a
          docker compose -f compose.yaml -f compose.ci.yaml --profile app logs --no-color --tail 200
