name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: smart_tutor
          POSTGRES_PASSWORD: smart_tutor
          POSTGRES_DB: smart_tutor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smart_tutor -d smart_tutor" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Architecture import contracts
        run: uv run lint-imports
      - name: Unit tests
        run: uv run pytest
      - name: Migrations apply
        run: uv run python -m smart_tutor.apps.jobs.migrate
        env:
          SMART_TUTOR_DATABASE_URL: postgresql+psycopg://smart_tutor:smart_tutor@localhost:5432/smart_tutor

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/tools/api-gen/package-lock.json
      - run: npm ci
      - run: npm --prefix tools/api-gen ci
      - name: Generated API client is current
        run: npm run api:generate && git diff --exit-code -- src/api
      - run: npm test
      - run: npm run build

  design:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Design tooling tests
        run: npm run test:design
      - name: states.json matches the prototype
        run: npm run design:states -- --check

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/smart-tutor
