# Deploys native-cloud mode (PRD §9.12, #59): cdk deploy, the cluster add-ons, and the Helm release. Opt-in since #150:
# deploy.yml calls it when started by hand with mode native-cloud, or on a push when the repository variable
# NATIVE_CLOUD_AUTO_DEPLOY is `true`; rollback.yml calls it with infrastructure false.
# deploy.yml builds its images into `smart-tutor/*` first.
# Signs in with the native-cloud deploy role (#55), which trusts only jobs in the `native-cloud` environment.
# Skipped unless the repository variable PRODUCTION_DEPLOY is `true` (#282).
name: deploy-native-cloud

on:
  workflow_call:
    inputs:
      image_tag:
        description: Commit SHA whose images to deploy
        type: string
        required: true
      infrastructure:
        description: Deploy the infrastructure with CDK first (false for a rollback)
        type: boolean
        required: true

jobs:
  deploy:
    # The production deploy switch (#282): skipped unless PRODUCTION_DEPLOY is `true`, whoever calls it.
    if: vars.PRODUCTION_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: native-cloud
    # One deployment at a time; a queued one waits instead of cancelling the running release.
    concurrency:
      group: deploy-native-cloud
      cancel-in-progress: false
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      REPOSITORY_PREFIX: smart-tutor  # its own ECR repositories (#206)
      JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: "1"
    steps:
      # Reject a malformed tag before checking out or signing in.
      - name: Check the image tag
        run: |
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::image_tag must be a full 40-character commit SHA"; exit 1; }

      # The chart and smoke test come from the deployed commit, so they match its images.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.image_tag }}

      # Setup actions run before the AWS credentials exist in the environment.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: inputs.infrastructure
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: inputs.infrastructure
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.2.1

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Check the images exist
        run: |
          for repo in api web keycloak agent mcp worker; do
            aws ecr describe-images --repository-name "$REPOSITORY_PREFIX/$repo" --image-ids imageTag="$IMAGE_TAG" > /dev/null \
              || { echo "::error::$REPOSITORY_PREFIX/$repo:$IMAGE_TAG is not in ECR (it keeps the last 30 images; only commits deployed to native-cloud, or merged before #206, have images here)"; exit 1; }
          done

      - name: Deploy the infrastructure (CDK)
        if: inputs.infrastructure
        working-directory: infra
        run: |
          uv sync --frozen
          npx --yes aws-cdk@2.1145.0 deploy --all --require-approval never -c smart-tutor:mode=native-cloud

      - name: Read the stack outputs
        run: |
          output() {
            aws cloudformation describe-stacks --stack-name "SmartTutor-prod-$1" \
              --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue" --output text
          }
          registry=$(output Registry RegistryUri)
          [[ -n "$registry" && "$registry" != None ]] || { echo "::error::SmartTutor-prod-Registry has no RegistryUri output"; exit 1; }
          cloudfront_url=$(output Edge CloudFrontUrl)
          [[ -n "$cloudfront_url" && "$cloudfront_url" != None ]] || { echo "::error::SmartTutor-prod-Edge has no CloudFrontUrl output"; exit 1; }
          vpc_id=$(output Network VpcId)
          [[ -n "$vpc_id" && "$vpc_id" != None ]] || { echo "::error::SmartTutor-prod-Network has no VpcId output"; exit 1; }
          documents_bucket=$(output Storage DocumentsBucketName)
          [[ -n "$documents_bucket" && "$documents_bucket" != None ]] || { echo "::error::SmartTutor-prod-Storage has no DocumentsBucketName output"; exit 1; }
          ingest_queue_url=$(output Storage IngestQueueUrl)
          [[ -n "$ingest_queue_url" && "$ingest_queue_url" != None ]] || { echo "::error::SmartTutor-prod-Storage has no IngestQueueUrl output"; exit 1; }
          question_guard=$(aws ssm get-parameter --name /smart-tutor/question-guard --query Parameter.Value --output text)
          [[ -n "$question_guard" && "$question_guard" != None ]] || { echo "::error::/smart-tutor/question-guard is not set (deploy the Config stack)"; exit 1; }
          question_guardrail_id=$(aws ssm get-parameter --name /smart-tutor/question-guardrail-id --query Parameter.Value --output text)
          [[ -n "$question_guardrail_id" && "$question_guardrail_id" != None ]] || { echo "::error::/smart-tutor/question-guardrail-id is not set (deploy the Config stack)"; exit 1; }
          question_guardrail_version=$(aws ssm get-parameter --name /smart-tutor/question-guardrail-version --query Parameter.Value --output text)
          [[ -n "$question_guardrail_version" && "$question_guardrail_version" != None ]] || { echo "::error::/smart-tutor/question-guardrail-version is not set (deploy the Config stack)"; exit 1; }
          {
            echo "REGISTRY=$registry"
            echo "CLOUDFRONT_URL=$cloudfront_url"
            echo "VPC_ID=$vpc_id"
            echo "DOCUMENTS_BUCKET=$documents_bucket"
            echo "INGEST_QUEUE_URL=$ingest_queue_url"
            echo "QUESTION_GUARD=$question_guard"
            echo "QUESTION_GUARDRAIL_ID=$question_guardrail_id"
            echo "QUESTION_GUARDRAIL_VERSION=$question_guardrail_version"
          } >> "$GITHUB_ENV"

      - name: Connect to the cluster
        run: aws eks update-kubeconfig --name smart-tutor-prod --region "$AWS_REGION"

      - name: Install the cluster add-ons
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo update
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller --version 3.5.0 -n kube-system -f deploy/helm/addons/aws-load-balancer-controller.yaml --set vpcId="$VPC_ID" --wait
          helm upgrade --install external-secrets external-secrets/external-secrets --version 2.11.0 -n external-secrets --create-namespace -f deploy/helm/addons/external-secrets.yaml --wait
          helm upgrade --install metrics-server metrics-server/metrics-server --version 3.14.0 -n kube-system -f deploy/helm/addons/metrics-server.yaml --wait

      # --wait=legacy: Helm 4's default watcher strategy sits out the whole --timeout on every hook that isn't a Job
      # (SecretStore, ExternalSecrets, ConfigMap), so the first install outran the job. Legacy still waits for the
      # hook Jobs and the rollout, as Helm 3 did.
      - name: Release the app (Helm)
        run: |
          helm upgrade --install smart-tutor deploy/helm/smart-tutor -n smart-tutor --create-namespace \
            -f deploy/helm/smart-tutor/values-prod.yaml \
            --set global.imageRegistry="$REGISTRY" --set global.imageTag="$IMAGE_TAG" \
            --set global.publicUrl="$CLOUDFRONT_URL" \
            --set global.documentsBucket="$DOCUMENTS_BUCKET" \
            --set global.ingestQueueUrl="$INGEST_QUEUE_URL" \
            --set-string global.questionGuard.mode="$QUESTION_GUARD" \
            --set-string global.questionGuard.guardrailId="$QUESTION_GUARDRAIL_ID" \
            --set-string global.questionGuard.guardrailVersion="$QUESTION_GUARDRAIL_VERSION" \
            --wait=legacy --timeout 15m

      # The agent and MCP server are in-cluster only, so the smoke test can't reach them: check from an API pod that
      # the names, ports, and auth line up (agent healthy; MCP refuses a call without a token).
      - name: Check the in-cluster services
        run: |
          kubectl -n smart-tutor exec deploy/api -- python -c "import urllib.request as u; u.urlopen('http://agent/healthz', timeout=10)"
          kubectl -n smart-tutor exec deploy/api -- python -c "
          import urllib.error as e, urllib.request as u
          try:
              u.urlopen('http://mcp-server/mcp', timeout=10)
          except e.HTTPError as x:
              raise SystemExit(0 if x.code == 401 else f'MCP answered {x.code} without a token, expected 401')
          raise SystemExit('MCP answered without a token')"

      - name: Smoke test the public address
        run: |
          python3 deploy/pilot/smoke_test.py "$CLOUDFRONT_URL"
          echo "Deployed \`$IMAGE_TAG\` to $CLOUDFRONT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics
        if: failure() || cancelled()
        run: |
          kubectl -n smart-tutor get pods,jobs,externalsecrets,targetgroupbindings || true
          kubectl -n smart-tutor logs job/migrate --tail=100 || true
          kubectl -n smart-tutor logs job/db-bootstrap --tail=50 || true
          kubectl -n smart-tutor logs deploy/worker --tail=50 || true
          kubectl -n smart-tutor logs deploy/agent --tail=50 || true
          helm -n smart-tutor history smart-tutor || true
