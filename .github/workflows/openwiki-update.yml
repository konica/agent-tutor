# Regenerates the agent-facing wiki in openwiki/ and opens a PR when it changes.
# Based on https://github.com/langchain-ai/openwiki/blob/main/examples/openwiki-update.yml
# Needs repo secret OPENWIKI_AWS_ROLE_ARN: an IAM role trusted for this repo via GitHub OIDC, allowed bedrock:InvokeModel*
# on the model below. Skips until the secret exists. A secret, not a variable: the public log would show the account id.
name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # A job-level `if` can't read secrets, so this job reports whether the role is set.
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.role.outputs.ready }}
    steps:
      - id: role
        env:
          HAS_ROLE: ${{ secrets.OPENWIKI_AWS_ROLE_ARN != '' }}
        run: echo "ready=$HAS_ROLE" >> "$GITHUB_OUTPUT"

  update:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          # Full history so `openwiki code --update` can diff HEAD against the commit it last documented.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.OPENWIKI_AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Install OpenWiki
        run: npm install --global openwiki@0.7.0

      - name: Run OpenWiki
        id: openwiki
        continue-on-error: true
        run: openwiki code --update --print
        env:
          OPENWIKI_TELEMETRY_DISABLED: "1"
          OPENWIKI_PROVIDER: bedrock
          BEDROCK_AWS_REGION: us-east-1
          OPENWIKI_MODEL_ID: us.anthropic.claude-sonnet-4-6

      - name: Remove transient OpenWiki run state
        if: ${{ !cancelled() }}
        run: rm -f -- openwiki/.run.json

      - name: Create OpenWiki update pull request
        id: create-pr
        if: ${{ !cancelled() }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: openwiki,AGENTS.md,CLAUDE.md
          branch: openwiki/update
          commit-message: "Update OpenWiki"
          title: "Update OpenWiki"
          body: |
            Automated OpenWiki update. Review like code: the wiki is a generated view; `sdd/` stays the source of truth.

            OpenWiki result: ${{ steps.openwiki.outcome }}

            On `failure`, this PR keeps only the pages completed before the failure. Merging it makes that progress the
            baseline for the next run.

      - name: Propagate OpenWiki failure
        if: ${{ steps.openwiki.outcome == 'failure' }}
        run: exit 1
