<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1224 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="langfuse-datasets-dark-title langfuse-datasets-dark-desc" id="langfuse-datasets-dark-root">
<title id="langfuse-datasets-dark-title">Create and publish an eval dataset in Langfuse</title>
<desc id="langfuse-datasets-dark-desc">An engineer generates candidate questions from the seed corpus with a Bedrock judge model, a reviewer accepts or rejects each one in a Langfuse annotation queue, and the engineer publishes the accepted items plus hand-written examples as a new frozen dataset version that a release pins by name.</desc>
<defs>
      <style>#langfuse-datasets-dark-root { color-scheme: dark;
      --color-paper:  #0e1418;
      --color-ink:    #e8eef2;
      --color-muted:  #b3bfc9;
      --color-accent: #4cc2b8;
      --color-rule:   rgba(232,238,242,0.12);
      --font-sans:    system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      --font-serif:   Charter, 'Bitstream Charter', 'Iowan Old Style', 'Palatino Linotype', Cambria, Georgia, serif;
      --font-mono:    ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace; }
      #langfuse-datasets-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #langfuse-datasets-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #langfuse-datasets-dark-root .notes { margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--color-rule);
      max-width: 72ch;
      font-size: 0.9rem;
      line-height: 1.55;
      color: var(--color-muted); }
      #langfuse-datasets-dark-root .notes h2 { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
                 text-transform: uppercase; margin-bottom: 0.5rem; }
      #langfuse-datasets-dark-root .notes ol, #langfuse-datasets-dark-root .notes ul { padding-left: 1.25rem; }
      #langfuse-datasets-dark-root .notes li + li { margin-top: 0.25rem; }
      #langfuse-datasets-dark-root .notes code { font-family: var(--font-mono); font-size: 0.82rem; color: var(--color-ink); }
      #langfuse-datasets-dark-root .diagram-container { overflow-x: visible; }</style>
