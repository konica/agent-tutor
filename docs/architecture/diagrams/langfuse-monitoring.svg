<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 64 984 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="langfuse-monitoring-title langfuse-monitoring-desc" id="langfuse-monitoring-root">
<title id="langfuse-monitoring-title">Observe Smart Tutor traces and metrics in Langfuse</title>
<desc id="langfuse-monitoring-desc">The agent and the ingestion worker send ask and ingest traces through an OpenTelemetry exporter over OTLP/HTTP to the production Langfuse project, where people read them in the trace explorer; learner ratings as scores and dashboards with alerts are planned.</desc>
<defs>
      <style>#langfuse-monitoring-root { color-scheme: light;
      --color-paper:  #f6f7f9;
      --color-ink:    #14202b;
      --color-muted:  #4a5866;
      --color-accent: #0b6b66;
      --color-rule:   rgba(20,32,43,0.12);
      --font-sans:    system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      --font-serif:   Charter, 'Bitstream Charter', 'Iowan Old Style', 'Palatino Linotype', Cambria, Georgia, serif;
      --font-mono:    ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace; }
      #langfuse-monitoring-root { font-family: var(--font-sans); color: var(--color-ink); }
      #langfuse-monitoring-root .diagram-container { width: 100%; overflow-x: auto; }
      #langfuse-monitoring-root .notes { margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--color-rule);
      max-width: 72ch;
      font-size: 0.9rem;
      line-height: 1.55;
      color: var(--color-muted); }
      #langfuse-monitoring-root .notes h2 { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
                 text-transform: uppercase; margin-bottom: 0.5rem; }
      #langfuse-monitoring-root .notes ol, #langfuse-monitoring-root .notes ul { padding-left: 1.25rem; }
      #langfuse-monitoring-root .notes li + li { margin-top: 0.25rem; }
      #langfuse-monitoring-root .notes code { font-family: var(--font-mono); font-size: 0.82rem; color: var(--color-ink); }
      #langfuse-monitoring-root .diagram-container { overflow-x: visible; }</style>
<marker id="langfuse-monitoring-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a5866"/></marker>
