<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 88 1320 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="langfuse-evaluators-title langfuse-evaluators-desc" id="langfuse-evaluators-root">
<title id="langfuse-evaluators-title">Run evaluators against a Langfuse dataset</title>
<desc id="langfuse-evaluators-desc">The eval suite reads the pinned dataset version, runs each item through the agent&#x27;s ask graph with real Bedrock models, scores the outputs with code evaluators and LLM judges, records the scores as an experiment, and gates the run against thresholds.yaml; until issue 320 the datasets and results the suite uses live in LangSmith.</desc>
<defs>
      <style>#langfuse-evaluators-root { color-scheme: light;
      --color-paper:  #f6f7f9;
      --color-ink:    #14202b;
      --color-muted:  #4a5866;
      --color-accent: #0b6b66;
      --color-rule:   rgba(20,32,43,0.12);
      --font-sans:    system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      --font-serif:   Charter, 'Bitstream Charter', 'Iowan Old Style', 'Palatino Linotype', Cambria, Georgia, serif;
      --font-mono:    ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace; }
      #langfuse-evaluators-root { font-family: var(--font-sans); color: var(--color-ink); }
      #langfuse-evaluators-root .diagram-container { width: 100%; overflow-x: auto; }
      #langfuse-evaluators-root .notes { margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--color-rule);
      max-width: 72ch;
      font-size: 0.9rem;
      line-height: 1.55;
      color: var(--color-muted); }
      #langfuse-evaluators-root .notes h2 { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
                 text-transform: uppercase; margin-bottom: 0.5rem; }
      #langfuse-evaluators-root .notes ol, #langfuse-evaluators-root .notes ul { padding-left: 1.25rem; }
      #langfuse-evaluators-root .notes li + li { margin-top: 0.25rem; }
      #langfuse-evaluators-root .notes code { font-family: var(--font-mono); font-size: 0.82rem; color: var(--color-ink); }
      #langfuse-evaluators-root .diagram-container { overflow-x: visible; }</style>
<marker id="langfuse-evaluators-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a5866"/></marker>
